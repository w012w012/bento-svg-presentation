<!--
  bento_defs_template.svg - 标准顶级质感基础定义 (2.1 增强版)
  可在生成 SVG 时直接作为 <defs> 模板注入，确保光影、网格、主色与语义对比度一致性
-->
<defs>
  <!-- 1. 数字化正方形网格底纹 (Tech Grid) -->
  <pattern id="techGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.3"/>
  </pattern>

  <!-- 2. 微弱科技点阵纹理 (Dot Grid) -->
  <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
  </pattern>

  <!-- 3. 核心品牌强调色渐变 (默认：电光青 -> 湖蓝) -->
  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00F2FE"/>
    <stop offset="100%" stop-color="#0284C7"/>
  </linearGradient>

  <!-- 4. 业务语义警示/危机渐变 (胭脂红 -> 橙红) -->
  <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F43F5E"/>
    <stop offset="100%" stop-color="#FB923C"/>
  </linearGradient>

  <!-- 5. 业务语义增长/突破渐变 (翡翠绿 -> 极客绿) -->
  <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#34D399"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>

  <!-- 6. 卡片表面细腻深度渐变 (暗黑微透) -->
  <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#0B1120" stop-opacity="0.95"/>
  </linearGradient>

  <!-- 7. 高级灰微光卡片表面 -->
  <linearGradient id="cardElevated" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
  </linearGradient>

  <!-- 8. 强调色外发光滤镜 (Web 预览增强) -->
  <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>

  <!-- 9. 幽暗投影滤镜 (Web 预览增强) -->
  <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
</defs>
