    <text x="28" y="231" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif"><tspan x="28" dy="0">诊断：严重依赖 PDD 低价跑量，天猫唯</tspan><tspan x="28" dy="20">一顶梁柱</tspan></text>
  </g>

