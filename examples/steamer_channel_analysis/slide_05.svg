<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="dotGrid5" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
    </pattern>
    <linearGradient id="breakthroughGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="strategyCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#070C18"/>
  <rect width="1280" height="720" fill="url(#dotGrid5)"/>

  <!-- 顶部 Header -->
  <g transform="translate(60, 35)">
    <rect x="0" y="4" width="4" height="32" rx="2" fill="#10B981"/>
    <text x="16" y="30" fill="#F8FAFC" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700">
      天猫破局路线：货盘重构、错位溢价与流量重塑
    </text>
    <text x="16" y="58" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif"><tspan x="16" dy="0">从“被动挨打”到“主动重构” · 30 </tspan><tspan x="16" dy="20">天四大战役打响天猫翻身仗，恢复渠道造血机</tspan><tspan x="16" dy="20">能</tspan></text>
  </g>

  <!-- Bento 网格: 左 1 大卡 (货盘重构矩阵), 右 2 张中卡 (定价错位 + 流量激活) -->

  <!-- 左侧大卡片 (宽 630, 高 535): 货盘回补与重组矩阵 -->
  <g transform="translate(60, 115)">
    <rect width="630" height="535" rx="16" fill="url(#strategyCardBg)" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- 标签与标题 -->
    <rect x="24" y="22" width="80" height="22" rx="4" fill="#064E3B"/>
    <text x="32" y="37" fill="#34D399" font-size="11" font-family="system-ui, sans-serif" font-weight="700">战略战役一</text>
    <text x="116" y="39" fill="#F8FAFC" font-size="18" font-family="system-ui, sans-serif" font-weight="700">货盘断层回补：重塑天猫“三级火箭”商品梯队</text>

    <!-- 梯队 1: 引流防守层 -->
    <g transform="translate(24, 65)">
      <rect width="582" height="100" rx="10" fill="#070E1A" stroke="#1E293B" stroke-width="1"/>
      <rect x="16" y="16" width="6" height="68" rx="3" fill="#64748B"/>
      <text x="34" y="36" fill="#F8FAFC" font-size="15" font-family="system-ui, sans-serif" font-weight="700"><tspan x="34" dy="0">底层引流防守：重启 DY20 (1,79</tspan><tspan x="34" dy="20">9元)</tspan></text>
      <text x="34" y="60" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 目标：匹配淘系 1500~2000 </tspan><tspan x="34" dy="20">元基础搜索流量，作为全店“流量漏斗底盘”</tspan></text>
      <text x="34" y="82" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 动作：配置“下单赠烤盘三件套”，守住</tspan><tspan x="34" dy="20">自然进店 UV 与首单成交转化</tspan></text>
    </g>

    <!-- 梯队 2: 腰部爆款层 (核心增量回补) -->
    <g transform="translate(24, 180)">
      <rect width="582" height="135" rx="10" fill="#071322" stroke="#0284C7" stroke-width="1"/>
      <rect x="16" y="16" width="6" height="103" rx="3" fill="#0284C7"/>
      <text x="34" y="36" fill="#38BDF8" font-size="15" font-family="system-ui, sans-serif" font-weight="700"><tspan x="34" dy="0">腰部放量中坚：紧急引入 DY66 (2,</tspan><tspan x="34" dy="20">499元) + 激活 DY50</tspan></text>
      <text x="34" y="60" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 现状：DY66 在抖音爆卖 144 </tspan><tspan x="34" dy="20">台、POP 卖 110 台，已验证具备极</tspan><tspan x="34" dy="20">强内容种草力</tspan></text>
      <text x="34" y="84" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 动作：将抖音种草外溢的搜索流量引向天</tspan><tspan x="34" dy="20">猫承接，终结“PY50 独苗苦撑”格局</tspan></text>
      <text x="34" y="108" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 目标：实现 DY66 与 PY50 </tspan><tspan x="34" dy="20">双核驱动，占据天猫大盘 50%+ 份额</tspan></text>
    </g>

    <!-- 梯队 3: 顶层旗舰利润层 -->
    <g transform="translate(24, 330)">
      <rect width="582" height="100" rx="10" fill="#140E0A" stroke="#B45309" stroke-width="1"/>
      <rect x="16" y="16" width="6" height="68" rx="3" fill="#F59E0B"/>
      <text x="34" y="36" fill="#FBBF24" font-size="15" font-family="system-ui, sans-serif" font-weight="700"><tspan x="34" dy="0">顶层利润旗舰：重塑 DY50 PRO (</tspan><tspan x="34" dy="20">2,899元) 旗舰心智</tspan></text>
      <text x="34" y="60" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 现状：天猫仅卖出 19 台（不及 P</tspan><tspan x="34" dy="20">DD 的 1/3），高端价值严重被掩埋</tspan></text>
      <text x="34" y="82" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="34" dy="0">• 动作：锁定 88VIP 大促消费券与</tspan><tspan x="34" dy="20">大额满减，主打高端家庭升级换代</tspan></text>
    </g>

    <!-- 底部状态条 -->
    <g transform="translate(24, 450)">
      <rect width="582" height="60" rx="8" fill="#0A0F1D"/>
      <text x="20" y="26" fill="#34D399" font-size="13" font-family="system-ui, sans-serif" font-weight="600">货盘规划目标 (30天达成)：</text>
      <text x="20" y="48" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif"><tspan x="20" dy="0">天猫机型覆盖由 3 款增至 5 款，单月</tspan><tspan x="20" dy="20">出货目标从 111 台拉升至 260 台</tspan><tspan x="20" dy="20">+</tspan></text>
    </g>
  </g>

  <!-- 右侧上卡片 (宽 510, 高 255): 错位定价与场景化包装 -->
  <g transform="translate(710, 115)">
    <rect width="510" height="255" rx="16" fill="url(#strategyCardBg)" stroke="#1E293B" stroke-width="1"/>
    <rect x="24" y="20" width="80" height="22" rx="4" fill="#1E293B"/>
    <text x="32" y="35" fill="#38BDF8" font-size="11" font-family="system-ui, sans-serif" font-weight="700">战略战役二</text>
    <text x="116" y="37" fill="#F8FAFC" font-size="17" font-family="system-ui, sans-serif" font-weight="700"><tspan x="116" dy="0">错位定价：拒绝与 PDD 裸机比价，做高</tspan><tspan x="116" dy="20">附加值</tspan></text>

    <text x="24" y="75" fill="#EF4444" font-size="13" font-family="system-ui, sans-serif" font-weight="600"><tspan x="24" dy="0">× 严禁错误：在天猫与拼多多拼裸机裸价（</tspan><tspan x="24" dy="20">必死无疑）</tspan></text>
    
    <g transform="translate(24, 95)">
      <rect width="462" height="135" rx="8" fill="#070E1A" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="25" fill="#34D399" font-size="13" font-family="system-ui, sans-serif" font-weight="700"><tspan x="16" dy="0">✓ 正确打法：场景化权益包装 (推高客单</tspan><tspan x="16" dy="20">与转化)</tspan></text>
      <text x="16" y="52" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">① <tspan fill="#F8FAFC" font-weight="600">服务赋能：</tspan>天猫标配“365天免费上门换新”服务，消除售后顾虑</text>
      <text x="16" y="78" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">② <tspan fill="#F8FAFC" font-weight="600">定制烘焙礼盒：</tspan>赠送定制模具与专属食谱，构建非标赠品溢价</text>
      <text x="16" y="104" fill="#CBD5E1" font-size="12" font-family="system-ui, sans-serif">③ <tspan fill="#F8FAFC" font-weight="600">家装套购连带：</tspan>微蒸烤 + 嵌入式烟灶联动，做高单客 GMV</text>
    </g>
  </g>

  <!-- 右侧下卡片 (宽 510, 高 260): 淘系流量精细化重塑 -->
  <g transform="translate(710, 390)">
    <rect width="510" height="260" rx="16" fill="url(#strategyCardBg)" stroke="#1E293B" stroke-width="1"/>
    <rect x="24" y="20" width="80" height="22" rx="4" fill="#1E293B"/>
    <text x="32" y="35" fill="#FBBF24" font-size="11" font-family="system-ui, sans-serif" font-weight="700">战略战役三</text>
    <text x="116" y="37" fill="#F8FAFC" font-size="17" font-family="system-ui, sans-serif" font-weight="700"><tspan x="116" dy="0">流量重塑：淘系“搜索防守 + 88VIP</tspan><tspan x="116" dy="20"> 爆发”组合拳</tspan></text>

    <g transform="translate(24, 65)">
      <circle cx="10" cy="15" r="4" fill="#06B6D4"/>
      <text x="25" y="20" fill="#F8FAFC" font-size="13" font-family="system-ui, sans-serif" font-weight="600">
        万相台与搜索防御矩阵：
      </text>
      <text x="25" y="42" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif"><tspan x="25" dy="0">以 DY20 和 PY50 投放品类大词</tspan><tspan x="25" dy="20">保底展现，DY66 承接抖音溢出的搜索拦</tspan><tspan x="25" dy="20">截。</tspan></text>
      
      <circle cx="10" cy="75" r="4" fill="#F59E0B"/>
      <text x="25" y="80" fill="#F8FAFC" font-size="13" font-family="system-ui, sans-serif" font-weight="600">
        大促脉冲与家装节攻坚：
      </text>
      <text x="25" y="102" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif"><tspan x="25" dy="0">绑定天猫天生优势的“家装节”、“天猫超级</tspan><tspan x="25" dy="20">品牌日”，主攻高端前装用户。</tspan></text>

      <circle cx="10" cy="135" r="4" fill="#10B981"/>
      <text x="25" y="140" fill="#F8FAFC" font-size="13" font-family="system-ui, sans-serif" font-weight="600">
        全渠道价格防护墙：
      </text>
      <text x="25" y="162" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif"><tspan x="25" dy="0">天猫价格与京东 POP 保持标杆平齐，拼</tspan><tspan x="25" dy="20">多多严格锁定特定专供/尾货代码。</tspan></text>
    </g>
  </g>
</svg>
