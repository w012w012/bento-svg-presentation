    const notes = [];
    let currentIndex = 0;
    let notesVisible = false;

    function renderSlide(index) {
      if (!slides || slides.length === 0) return;
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentIndex = index;

      const stage = document.getElementById("stage");
      stage.innerHTML = slides[currentIndex];
      document.getElementById("indicator").innerText = `${currentIndex + 1} / ${slides.length}`;
      
      const nText = (notes && notes[currentIndex]) ? notes[currentIndex] : "本页核心关注：结合图表与核心指标展开，强调数据背后的业务归因。";
      document.getElementById("notesText").innerHTML = nText;
    }

    function prevSlide() { renderSlide(currentIndex - 1); }
    function nextSlide() { renderSlide(currentIndex + 1); }
    function toggleNotes() {
      notesVisible = !notesVisible;
      const drawer = document.getElementById("notesDrawer");
      const btn = document.getElementById("notesBtn");
      if (notesVisible) {
        drawer.classList.add("open");
        btn.classList.add("btn-active");
      } else {
        drawer.classList.remove("open");
        btn.classList.remove("btn-active");
      }
    }
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // 纯前端利用 Canvas 一键无损导出 1920x1080 高清 PNG
    function exportCurrentSlidePNG() {
      const svgElement = document.querySelector("#stage svg");

      const canvas = document.createElement("canvas");

      canvas.height = 1080;
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.drawImage(img, 0, 0, 1920, 1080);
        URL.revokeObjectURL(url);
        const a = document.createElement("a");
        a.download = `slide_${String(currentIndex + 1).padStart(2, "0")}_1080p.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") nextSlide();
      if (e.key === "n" || e.key === "N") toggleNotes();
      if (e.key === "e" || e.key === "E") exportCurrentSlidePNG();
      if (e.key === "f" || e.key === "F") toggleFullScreen();
    });

    renderSlide(0);
  </script>
</body>
</html>
