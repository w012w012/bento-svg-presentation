    <line x1="20" y1="120" x2="346" y2="120" stroke="#1E293B" stroke-width="1"/>
    
    <!-- 渠道去向条形 -->
    <text x="20" y="145" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif">• PDD 渠道独吞：<tspan fill="#F97316" font-weight="700">260台 (67.2%)</tspan></text>
    <text x="20" y="172" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif">• 天猫支撑主力：<tspan fill="#38BDF8" font-weight="700">78台 (占天猫70%)</tspan></text>
