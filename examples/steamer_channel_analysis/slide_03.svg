    <text x="90" y="37" fill="#F8FAFC" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Y6</text>
    <text x="348" y="37" text-anchor="end" fill="#94A3B8" font-size="16" font-family="system-ui, sans-serif" font-weight="600">2,399 元</text>

    <!-- 核心指标 -->
    <text x="20" y="80" fill="#C084FC" font-size="34" font-family="system-ui, sans-serif" font-weight="800">78<tspan font-size="16" fill="#64748B" font-weight="500"> 台</tspan></text>
    <text x="150" y="80" fill="#38BDF8" font-size="28" font-family="system-ui, sans-serif" font-weight="700">18.7<tspan font-size="14" fill="#64748B" font-weight="500"> 万元</tspan></text>
