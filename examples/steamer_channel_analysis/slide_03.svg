    <text x="90" y="37" fill="#F8FAFC" font-size="20" font-family="system-ui, sans-serif" font-weight="700">PY50</text>
    <text x="346" y="37" text-anchor="end" fill="#94A3B8" font-size="16" font-family="system-ui, sans-serif" font-weight="600">2,299 元</text>

    <!-- 核心指标 -->
    <text x="20" y="80" fill="#34D399" font-size="34" font-family="system-ui, sans-serif" font-weight="800">387<tspan font-size="16" fill="#64748B" font-weight="500"> 台</tspan></text>
    <text x="150" y="80" fill="#38BDF8" font-size="28" font-family="system-ui, sans-serif" font-weight="700">89.0<tspan font-size="14" fill="#64748B" font-weight="500"> 万元</tspan></text>
