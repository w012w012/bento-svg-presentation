    <text x="20" y="172" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif">• 京东自营配载：<tspan fill="#38BDF8" font-weight="700">120台 (40.8%)</tspan></text>
    <text x="20" y="199" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif">• 天猫仅 14 台，引流防守心智几乎归零</text>
