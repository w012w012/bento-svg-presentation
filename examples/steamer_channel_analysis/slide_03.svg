    <text x="28" y="231" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif"><tspan x="28" dy="0">诊断：天猫缺乏入门钩子，搜索进店权重持续</tspan><tspan x="28" dy="20">被削弱</tspan></text>
  </g>

  <!-- 6. Y6 (抖音专供机 - 2399元) -->
