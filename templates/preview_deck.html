<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DECK_TITLE}} - Bento SVG Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050811;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    header {
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0B1120;
      border-bottom: 1px solid #1E293B;
      z-index: 10;
    }
    .deck-title {
      font-size: 15px;
      font-weight: 600;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .deck-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1E293B;
      color: #00F2FE;
      font-weight: 700;
      border: 1px solid #00F2FE44;
    }
    .nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #334155;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn:hover { background: #334155; color: #FFFFFF; }
    .btn-active { background: #0F2D3D; color: #00F2FE; border-color: #00F2FE; }
    .page-indicator { font-size: 13px; font-weight: 700; color: #00F2FE; margin: 0 4px; }
    
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }
    .slide-stage {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #080C14;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #1E293B;
      position: relative;
    }
    .slide-stage svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* 演讲者备注抽屉 (Speaker Notes Drawer) */
    .notes-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid #00F2FE;
      padding: 16px 24px;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      z-index: 20;
      max-height: 200px;
      overflow-y: auto;
    }
    .notes-drawer.open { transform: translateY(0); }
    .notes-header {
      font-size: 12px;
      font-weight: 700;
      color: #00F2FE;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .notes-content { font-size: 13px; line-height: 1.6; color: #CBD5E1; }

    /* 九宫格总览视图 (Overview Modal) */
    .overview-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 8, 17, 0.92);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 24px;
    }
    .overview-modal.open { display: flex; }
    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .overview-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      overflow-y: auto;
      padding: 10px 4px;
    }
    .overview-card {
      background: #0B1120;
      border: 1.5px solid #1E293B;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 16 / 9;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .overview-card:hover {
      border-color: #00F2FE;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.25);
    }
    .overview-card.current {
      border-color: #00F2FE;
      box-shadow: 0 0 0 2px #00F2FE;
    }
    .overview-card svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .overview-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      color: #F8FAFC;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0F172A;
      color: #00F2FE;
      border: 1px solid #00F2FE;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      z-index: 200;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <div class="deck-title">
      <span>{{DECK_TITLE}}</span>
      <span class="deck-badge">BENTO 2.1</span>
    </div>
    <div class="nav-controls">
      <button class="btn" onclick="prevSlide()" title="快捷键: ←">← 上一页</button>
      <span class="page-indicator" id="indicator">1 / 1</span>
      <button class="btn" onclick="nextSlide()" title="快捷键: →">下一页 →</button>
      <button class="btn" id="notesBtn" onclick="toggleNotes()" title="快捷键: N">演讲备注 (N)</button>
      <button class="btn" id="overviewBtn" onclick="toggleOverview()" title="快捷键: O 或 G">全览视图 (O)</button>
      <button class="btn" onclick="copyCurrentSVG()" title="快捷键: C">复制 SVG (C)</button>
      <button class="btn" onclick="exportCurrentSlidePNG()" title="快捷键: E">导出 1080P (E)</button>
      <button class="btn" onclick="toggleFullScreen()" title="快捷键: F">全屏 (F)</button>
    </div>
  </header>
  <main>
    <div class="slide-stage" id="stage"></div>
    <div class="notes-drawer" id="notesDrawer">
      <div class="notes-header">
        <span>SPEAKER NOTES · 演讲者汇报说辞与参考数据</span>
        <span>按 N 键折叠</span>
      </div>
      <div class="notes-content" id="notesText">暂无备注</div>
    </div>
  </main>

  <!-- 九宫格缩略图总览 -->
  <div class="overview-modal" id="overviewModal">
    <div class="overview-header">
      <h2 style="font-size: 18px; color: #F8FAFC;">幻灯片全景总览 (Overview)</h2>
      <button class="btn btn-active" onclick="toggleOverview()">关闭总览 (ESC)</button>
    </div>
    <div class="overview-grid" id="overviewGrid"></div>
  </div>

  <div class="toast" id="toastBox">提示信息</div>

  <script>
    const slides = {{SLIDES_JSON}};
    const notes = {{NOTES_JSON}};
    let currentIndex = 0;
    let notesVisible = false;
    let overviewVisible = false;

    function showToast(msg) {
      const toast = document.getElementById("toastBox");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => { toast.classList.remove("show"); }, 2200);
    }

    function renderSlide(index) {
      if (!slides || slides.length === 0) return;
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentIndex = index;

      const stage = document.getElementById("stage");
      stage.innerHTML = slides[currentIndex];
      document.getElementById("indicator").innerText = `${currentIndex + 1} / ${slides.length}`;
      
      const nText = (notes && notes[currentIndex]) ? notes[currentIndex] : "本页核心关注：结合图表与核心指标展开，强调数据背后的业务归因。";
      document.getElementById("notesText").innerHTML = nText;
    }

    function prevSlide() { renderSlide(currentIndex - 1); }
    function nextSlide() { renderSlide(currentIndex + 1); }

    function toggleNotes() {
      notesVisible = !notesVisible;
      const drawer = document.getElementById("notesDrawer");
      const btn = document.getElementById("notesBtn");
      if (notesVisible) {
        drawer.classList.add("open");
        btn.classList.add("btn-active");
      } else {
        drawer.classList.remove("open");
        btn.classList.remove("btn-active");
      }
    }

    function toggleOverview() {
      overviewVisible = !overviewVisible;
      const modal = document.getElementById("overviewModal");
      const btn = document.getElementById("overviewBtn");
      if (overviewVisible) {
        buildOverviewGrid();
        modal.classList.add("open");
        btn.classList.add("btn-active");
      } else {
        modal.classList.remove("open");
        btn.classList.remove("btn-active");
      }
    }

    function buildOverviewGrid() {
      const grid = document.getElementById("overviewGrid");
      grid.innerHTML = "";
      slides.forEach((svgStr, idx) => {
        const card = document.createElement("div");
        card.className = `overview-card ${idx === currentIndex ? "current" : ""}`;
        card.innerHTML = `<span class="overview-badge">P${idx + 1}</span>${svgStr}`;
        card.onclick = () => {
          renderSlide(idx);
          toggleOverview();
        };
        grid.appendChild(card);
      });
    }

    function copyCurrentSVG() {
      if (!slides || !slides[currentIndex]) return;
      navigator.clipboard.writeText(slides[currentIndex]).then(() => {
        showToast(`已复制第 ${currentIndex + 1} 页 SVG 矢量源码！`);
      }).catch(err => {
        showToast("复制失败，请手动在控制台获取");
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // 纯前端利用 Canvas 一键无损导出 1920x1080 高清 PNG
    function exportCurrentSlidePNG() {
      const svgElement = document.querySelector("#stage svg");
      if (!svgElement) return;

      const svgData = new XMLSerializer().serializeToString(svgElement);
      const canvas = document.createElement("canvas");
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.drawImage(img, 0, 0, 1920, 1080);
        URL.revokeObjectURL(url);
        const a = document.createElement("a");
        a.download = `slide_${String(currentIndex + 1).padStart(2, "0")}_1080p.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
        showToast(`已导出第 ${currentIndex + 1} 页 1080P 高清 PNG！`);
      };
      img.src = url;
    }

    // 键盘快捷键监听
    window.addEventListener("keydown", (e) => {
      if (overviewVisible) {
        if (e.key === "Escape" || e.key === "o" || e.key === "O" || e.key === "g" || e.key === "G") {
          toggleOverview();
        }
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevSlide();
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") nextSlide();
      if (e.key === "n" || e.key === "N") toggleNotes();
      if (e.key === "o" || e.key === "O" || e.key === "g" || e.key === "G") toggleOverview();
      if (e.key === "c" || e.key === "C") copyCurrentSVG();
      if (e.key === "e" || e.key === "E") exportCurrentSlidePNG();
      if (e.key === "f" || e.key === "F") toggleFullScreen();
      if (e.key === "Escape" && notesVisible) toggleNotes();
    });

    // 移动端/触屏左右滑动翻页支持
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    document.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX - touchStartX > 60) prevSlide();
      if (touchStartX - touchEndX > 60) nextSlide();
    }, false);

    renderSlide(0);
  </script>
</body>
</html>
