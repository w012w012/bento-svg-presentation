<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="dotGrid2" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pddGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="dyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#070C18"/>
  <rect width="1280" height="720" fill="url(#dotGrid2)"/>

  <!-- 顶部 Header 区域 (y: 35 ~ 110) -->
  <g transform="translate(60, 35)">
    <rect x="0" y="4" width="4" height="32" rx="2" fill="#06B6D4"/>
    <text x="16" y="30" fill="#F8FAFC" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700">
      全渠道大盘概览：双寡头领跑与天猫的异常坍塌
    </text>
    <text x="16" y="60" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif"><tspan x="16" dy="0">全网月销量 1,554 台 / 销额 3</tspan><tspan x="16" dy="20">65.0 万元 · 京东与拼多多吃下近八</tspan><tspan x="16" dy="20">成份额，天猫陷入严重失血</tspan></text>
    <!-- 右侧指标胶囊 -->
    <rect x="990" y="10" width="170" height="38" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="1006" y="34" fill="#64748B" font-size="12" font-family="system-ui, sans-serif">全盘件均价(ASP): </text>
    <text x="1108" y="34" fill="#38BDF8" font-size="16" font-family="system-ui, sans-serif" font-weight="700">2,348元</text>
  </g>

  <!-- 主内容区: Bento Grid 混合网格 (y: 120 ~ 670) -->

  <!-- 左侧大卡片 (宽 740, 高 535): 渠道销量与销售额横向图表对比 -->
  <g transform="translate(60, 120)">
    <rect width="740" height="535" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    
    <!-- 卡片标题 -->
    <text x="28" y="38" fill="#F8FAFC" font-size="18" font-family="system-ui, sans-serif" font-weight="700">各大渠道规模与份额多维透视</text>
    <text x="28" y="60" fill="#64748B" font-size="12" font-family="system-ui, sans-serif"><tspan x="28" dy="0">各渠道月销量(台)、销售额(万元)与销售</tspan><tspan x="28" dy="20">均价对比</tspan></text>

    <!-- 图表表头 -->
    <g transform="translate(28, 85)">
      <text x="0" y="0" fill="#475569" font-size="12" font-family="system-ui, sans-serif" font-weight="600">销售渠道</text>
      <text x="110" y="0" fill="#475569" font-size="12" font-family="system-ui, sans-serif" font-weight="600">销量占比条形图 (台 / 份额)</text>
      <text x="490" y="0" fill="#475569" font-size="12" font-family="system-ui, sans-serif" font-weight="600">销额 (万元)</text>
      <text x="600" y="0" fill="#475569" font-size="12" font-family="system-ui, sans-serif" font-weight="600">件单价(元)</text>
      <line x1="0" y1="12" x2="684" y2="12" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- 渠道 1: 京东自营 -->
    <g transform="translate(28, 125)">
      <text x="0" y="24" fill="#E2E8F0" font-size="15" font-family="system-ui, sans-serif" font-weight="600">京东自营</text>
      <rect x="110" y="8" width="340" height="22" rx="4" fill="#1E293B"/>
      <!-- 470/1554 = 30.2% -> 宽 102.7 -->
      <rect x="110" y="8" width="103" height="22" rx="4" fill="url(#blueGrad)"/>
      <text x="225" y="24" fill="#38BDF8" font-size="13" font-family="system-ui, sans-serif" font-weight="700">470台 <tspan fill="#64748B" font-weight="400">(30.2%)</tspan></text>
      <text x="490" y="24" fill="#F8FAFC" font-size="15" font-family="system-ui, sans-serif" font-weight="600">111.1 万</text>
      <text x="600" y="24" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif">2,363</text>
    </g>

    <!-- 渠道 2: 拼多多 PDD -->
    <g transform="translate(28, 185)">
      <text x="0" y="24" fill="#E2E8F0" font-size="15" font-family="system-ui, sans-serif" font-weight="600">拼多多</text>
      <rect x="110" y="8" width="340" height="22" rx="4" fill="#1E293B"/>
      <!-- 482/1554 = 31.0% -> 宽 105.4 -->
      <rect x="110" y="8" width="105" height="22" rx="4" fill="url(#pddGrad)"/>
      <text x="225" y="24" fill="#FB923C" font-size="13" font-family="system-ui, sans-serif" font-weight="700">482台 <tspan fill="#64748B" font-weight="400">(31.0%)</tspan></text>
      <text x="490" y="24" fill="#F8FAFC" font-size="15" font-family="system-ui, sans-serif" font-weight="600">108.0 万</text>
      <text x="600" y="24" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif">2,240</text>
    </g>

    <!-- 渠道 3: 京东POP -->
    <g transform="translate(28, 245)">
      <text x="0" y="24" fill="#E2E8F0" font-size="15" font-family="system-ui, sans-serif" font-weight="600">京东POP</text>
      <rect x="110" y="8" width="340" height="22" rx="4" fill="#1E293B"/>
      <!-- 267/1554 = 17.2% -> 宽 58.5 -->
      <rect x="110" y="8" width="59" height="22" rx="4" fill="#0284C7"/>
      <text x="180" y="24" fill="#38BDF8" font-size="13" font-family="system-ui, sans-serif" font-weight="700">267台 <tspan fill="#64748B" font-weight="400">(17.2%)</tspan></text>
      <text x="490" y="24" fill="#F8FAFC" font-size="15" font-family="system-ui, sans-serif" font-weight="600">64.9 万</text>
      <text x="600" y="24" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif">2,429</text>
    </g>

    <!-- 渠道 4: 抖音 -->
    <g transform="translate(28, 305)">
      <text x="0" y="24" fill="#E2E8F0" font-size="15" font-family="system-ui, sans-serif" font-weight="600">抖音</text>
      <rect x="110" y="8" width="340" height="22" rx="4" fill="#1E293B"/>
      <!-- 224/1554 = 14.4% -> 宽 49.0 -->
      <rect x="110" y="8" width="49" height="22" rx="4" fill="url(#dyGrad)"/>
      <text x="170" y="24" fill="#F472B6" font-size="13" font-family="system-ui, sans-serif" font-weight="700">224台 <tspan fill="#64748B" font-weight="400">(14.4%)</tspan></text>
      <text x="490" y="24" fill="#F8FAFC" font-size="15" font-family="system-ui, sans-serif" font-weight="600">55.2 万</text>
      <text x="600" y="24" fill="#38BDF8" font-size="14" font-family="system-ui, sans-serif" font-weight="700">2,462 (最高)</text>
    </g>

    <!-- 渠道 5: 天猫 (警示标红高亮对比) -->
    <g transform="translate(28, 365)">
      <rect x="-10" y="-2" width="704" height="48" rx="8" fill="#1C1017" stroke="#E11D48" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="0" y="28" fill="#FDA4AF" font-size="15" font-family="system-ui, sans-serif" font-weight="700">天猫</text>
      <rect x="110" y="12" width="340" height="22" rx="4" fill="#2E1020"/>
      <!-- 111/1554 = 7.1% -> 宽 24.1 -->
      <rect x="110" y="12" width="24" height="22" rx="4" fill="#E11D48"/>
      <text x="145" y="28" fill="#F43F5E" font-size="13" font-family="system-ui, sans-serif" font-weight="700">111台 <tspan fill="#FDA4AF" font-weight="700">(7.1% 垫底)</tspan></text>
      <text x="490" y="28" fill="#FDA4AF" font-size="15" font-family="system-ui, sans-serif" font-weight="700">26.0 万</text>
      <text x="600" y="28" fill="#FDA4AF" font-size="14" font-family="system-ui, sans-serif">2,339</text>
    </g>

    <!-- 底部小结条 -->
    <g transform="translate(28, 440)">
      <rect width="684" height="65" rx="8" fill="#070D1A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="32" r="4" fill="#38BDF8"/>
      <text x="35" y="27" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">京东系双轨驱动：<tspan fill="#94A3B8" font-weight="400">自营跑量 + POP 承接高溢价，合计掌控 47.4% 销量与 48.2% 销额</tspan></text>
      <text x="35" y="49" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif" font-weight="600">天猫全面脱轨：<tspan fill="#F87171" font-weight="400">体量仅及自营的 1/4、拼多多的 1/4，彻底丧失主流家电阵地权重</tspan></text>
    </g>
  </g>

  <!-- 右侧上卡片 (宽 400, 高 255): 京东基本盘核心指标 -->
  <g transform="translate(820, 120)">
    <rect width="400" height="255" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="35" fill="#64748B" font-size="13" font-family="system-ui, sans-serif" font-weight="600">核心基本盘</text>
    <text x="24" y="70" fill="#38BDF8" font-size="34" font-family="system-ui, sans-serif" font-weight="800">京东系 48.2%</text>
    <text x="24" y="98" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">合计销额 175.9 万元 · 出货 7</tspan><tspan x="24" dy="20">37 台</tspan></text>
    <line x1="24" y1="120" x2="376" y2="120" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="150" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">• 自营掌握 DY50 与旗舰 DY50</tspan><tspan x="24" dy="20"> PRO 话语权</tspan></text>
    <text x="24" y="178" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">• POP 高度承接 DY66 (110</tspan><tspan x="24" dy="20">台)，分流灵活</tspan></text>
    <text x="24" y="206" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif">• 贡献全店最高稳定性与安装售后高评价</text>
    <rect x="24" y="222" width="80" height="20" rx="4" fill="#0369A1" opacity="0.4"/>
    <text x="32" y="236" fill="#38BDF8" font-size="11" font-family="system-ui, sans-serif" font-weight="700">核心现金牛</text>
  </g>

  <!-- 右侧下卡片 (宽 400, 高 260): 拼多多与抖音增量特性 -->
  <g transform="translate(820, 395)">
    <rect width="400" height="260" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="35" fill="#64748B" font-size="13" font-family="system-ui, sans-serif" font-weight="600">渠道分化特征</text>
    <text x="24" y="70" fill="#FB923C" font-size="34" font-family="system-ui, sans-serif" font-weight="800">PDD 走量 / 抖音打爆</text>
    <text x="24" y="98" fill="#94A3B8" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">PDD 占 31% 销量 · 抖音贡献最</tspan><tspan x="24" dy="20">高 ASP (2,462元)</tspan></text>
    <line x1="24" y1="120" x2="376" y2="120" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="150" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">• PDD 依赖 PY50 (260台)</tspan><tspan x="24" dy="20"> 与 DY20 (140台) 低价跑量</tspan></text>
    <text x="24" y="178" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">• 抖音独家爆款机制：包揽全网全部 Y6</tspan><tspan x="24" dy="20"> (78台)</tspan></text>
    <text x="24" y="206" fill="#CBD5E1" font-size="13" font-family="system-ui, sans-serif"><tspan x="24" dy="0">• 抖音成为 DY66 最大主战场 (1</tspan><tspan x="24" dy="20">44台/占该款52.7%)</tspan></text>
    <rect x="24" y="224" width="80" height="20" rx="4" fill="#7C2D12" opacity="0.5"/>
    <text x="32" y="238" fill="#FDBA74" font-size="11" font-family="system-ui, sans-serif" font-weight="700">爆款孵化场</text>
  </g>
</svg>
