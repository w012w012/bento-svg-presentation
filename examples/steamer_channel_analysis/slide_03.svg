<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="dotGrid3" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6"/>
    </pattern>
    <linearGradient id="flagshipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#070C18"/>
  <rect width="1280" height="720" fill="url(#dotGrid3)"/>

  <!-- 顶部 Header -->
  <g transform="translate(60, 35)">
    <rect x="0" y="4" width="4" height="32" rx="2" fill="#F59E0B"/>
    <text x="16" y="30" fill="#F8FAFC" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700">
      机型矩阵透视：单品高度集中与渠道严重偏科
    </text>
    <text x="16" y="58" fill="#94A3B8" font-size="14" font-family="system-ui, sans-serif"><tspan x="16" dy="0">六大机型定价 1,799~2,899 元</tspan><tspan x="16" dy="20"> · 核心利润款依赖京东，走量爆款依赖拼</tspan><tspan x="16" dy="20">多多与抖音</tspan></text>
  </g>

  <!-- Bento Grid: 上方 3 个卡片 (三款支柱机型)，下方 3 个卡片 (另外三款机型) -->
  
  <!-- 1. PY50 (销量冠军款 - 2299元) -->
  <g transform="translate(60, 115)">
    <rect width="366" height="255" rx="14" fill="url(#cardGrad3)" stroke="#1E293B" stroke-width="1"/>
    <rect x="20" y="20" width="60" height="22" rx="4" fill="#065F46" opacity="0.7"/>
